<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="筋トレ">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>ハビモン筋トレ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="window status-window">
      <span class="name">ハビモン筋トレ</span>
      <button id="logout" class="small" hidden>ログアウト</button>
    </header>
    <main id="view"><p class="hint center">読み込み中…</p></main>
  </div>
  <div id="rest" class="rest-bar" hidden>
    <div class="rest-main">
      <span class="rest-label">休憩<small id="rest-name"></small></span>
      <span id="rest-time" class="rest-time">0:00</span>
    </div>
    <div class="rest-buttons">
      <button type="button" class="small" id="rest-minus">−15秒</button>
      <button type="button" class="small" id="rest-plus">＋15秒</button>
      <button type="button" class="small" id="rest-sound">音 オン</button>
      <button type="button" class="small" id="rest-skip">スキップ</button>
    </div>
  </div>
  <div id="message" class="message-layer" hidden>
    <div class="window message-window">
      <p id="message-text"></p>
      <span class="message-next">▼</span>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
